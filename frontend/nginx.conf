# 정적 파일 서빙 + /api reverse proxy.
# ${BACKEND_HOST}는 Dockerfile의 ARG(envsubst로 주입), 기본값 "backend:8321"
# = docker-compose.yml의 backend 서비스 이름과 포트.
server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 서류 사진을 여러 장 한 번에 올리므로 기본값(1m)으로는 부족
    client_max_body_size 128m;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json;

    # compose healthcheck 용도
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API -> backend 컨테이너
    # proxy_pass에 변수를 쓰면 요청 시점에 Docker 내장 DNS로 해석하므로,
    # backend가 아직 떠 있지 않아도 nginx 기동 자체가 실패하지 않는다.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "${BACKEND_HOST}";

        proxy_pass http://$backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 업로드를 nginx 디스크에 버퍼링하지 않고 backend로 스트리밍
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
    }

    location ~* \.(css|js|ico|svg|png)$ {
        expires  1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

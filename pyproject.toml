[project]
name = "insurance-claim"
version = "0.1.0"
description = "병원·약국 서류 사진을 환자/날짜/진단별로 분류하고 보험 청구 정보를 추출하는 로컬 웹앱"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pillow-heif>=0.16",
]
